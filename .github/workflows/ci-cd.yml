name: ci-cd-demo-fast

on:
  push:
    branches: [ "main" ]

jobs:
  ci-cd: # Combine into one single job for speed
    runs-on: ubuntu-latest
    environment: cicd-test
    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm' # Will be instant after the first successful run

    - name: Install & Test
      run: |
        npm ci
        npm test

    - name: Login & Build Docker
      uses: [docker/login-action](https://github.com)@v3
      with: 
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push
      run: |
        docker build --tag ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-demo .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-demo:latest
