name: ci-cd-demo

on:
  push:
    branches: [ "main" ]
    
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps: 
    - name: checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm' # Speeds up subsequent runs

    - name: Install dependencies
      run: npm ci # Faster/cleaner install using your package-lock.json

    - name: Test
      run: npm test

  build:
    needs: test # [CRITICAL] This ensures build only runs if test passes
    runs-on: ubuntu-latest
    environment: cicd-test
    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: Login to Dockerhub
      uses: docker/login-action@v3
      with: 
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}


    - name: Build and push
      uses: docker/build-push-action@v6
      env: 
         IMAGE_NAME: ci-cd-demo
      with:
        context: . # Directory containing your Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: cicd-deploy
    steps:
    - name: Deploy to AWS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Pull the latest image and run it
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-demo:latest
          docker stop ci-cd-demo || true
          docker rm ci-cd-demo || true
          docker run -d --name ci-cd-demo -p 80:3000 ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-demo:latest
