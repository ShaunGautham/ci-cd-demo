name: ci-cd-demo

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: cicd-test 
    steps: 
    - name: checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm' # [SPEED FIX] Caches node_modules to save ~1 min

    - name: Install dependencies
      run: npm ci # [SPEED FIX] Faster and safer for CI than 'npm install'

    - name: Test
      run: npm test

  build:
    needs: test # [LOGIC FIX] Build only starts if tests pass
    runs-on: ubuntu-latest
    environment: cicd-test
    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: Login to Dockerhub
      uses: docker/login-action@v3
      with: 
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker image
      env: 
         DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
         IMAGE_NAME: ci-cd-demo
      run: |
        docker build --tag $DOCKERHUB_USERNAME/$IMAGE_NAME .
        docker push $DOCKERHUB_USERNAME/$IMAGE_NAME:latest
